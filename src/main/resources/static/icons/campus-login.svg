<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Campus at sunset</title>
  <desc id="description">A quiet university campus with a modern academic building, trees, a garden path, and students walking at sunset.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17334f"/>
      <stop offset=".48" stop-color="#557c91"/>
      <stop offset=".79" stop-color="#d89b72"/>
      <stop offset="1" stop-color="#f0c89a"/>
    </linearGradient>
    <linearGradient id="building" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2d9c8"/>
      <stop offset="1" stop-color="#a8b2ad"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9c58f"/>
      <stop offset=".45" stop-color="#8eafaf"/>
      <stop offset="1" stop-color="#34566a"/>
    </linearGradient>
    <linearGradient id="path" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9a78d"/>
      <stop offset="1" stop-color="#e1cfad"/>
    </linearGradient>
    <linearGradient id="lawn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#52735e"/>
      <stop offset="1" stop-color="#203d3b"/>
    </linearGradient>
    <radialGradient id="sun-glow">
      <stop offset="0" stop-color="#ffe2a5" stop-opacity=".85"/>
      <stop offset="1" stop-color="#f3bd82" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
  </defs>

