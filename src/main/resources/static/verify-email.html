<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email - MIT Student Portal</title>
  <meta name="referrer" content="no-referrer">
  <script>
    const verificationLinkParams = new URLSearchParams(window.location.hash.slice(1));
    const legacyVerificationParams = new URLSearchParams(window.location.search);
    window.emailVerificationToken = verificationLinkParams.get('token')
      || legacyVerificationParams.get('token')
      || legacyVerificationParams.get('code');
    if (window.location.search || window.location.hash) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="portal-auth-page verify-auth-page">
  <button class="auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">🌙</button>
  <div class="page-wrapper">
    <div class="card"><div class="card-header"><div class="logo-shield"><img src="icons/logo.jpg" alt="MIT Logo" class="logo-img"></div><div class="header-text"><h1>Makerere Institute<br>of Technology</h1><div class="tagline">Student Portal</div></div></div><div class="card-body"><div class="step active"><div class="step-header"><h2>Email Verification</h2><p id="verificationStatus">Checking your verification link...</p></div><form id="resendVerificationForm"><div class="input-wrap"><span class="icon">✉</span><input id="verificationEmail" type="email" placeholder="Email address" required></div><button class="btn-next" type="submit">RESEND EMAIL <span class="arrow">›</span></button></form></div></div></div>
    <div class="card-footer"><p class="help-text"><a href="index.html">Return to sign in</a></p></div>
  </div>
  <script src="js/deployment-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/verify-email.js"></script>
</body>
</html>
