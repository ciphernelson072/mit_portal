<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Reset Password - MIT Student Portal</title>
  <script>
    const resetLinkParams = new URLSearchParams(window.location.hash.slice(1));
    const legacyResetParams = new URLSearchParams(window.location.search);
    window.passwordResetToken = resetLinkParams.get('token') || legacyResetParams.get('token');
    if (window.location.search || window.location.hash) {
      window.history.replaceState({}, document.title, window.location.pathname);
    }
  </script>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="portal-auth-page reset-auth-page">
  <button class="auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">🌙</button>
  <div class="page-wrapper">
    <div class="card">
      <div class="card-header">
        <div class="logo-shield"><img src="icons/logo.jpg" alt="MIT Logo" class="logo-img"></div>
        <div class="header-text"><h1>Makerere Institute<br>of Technology</h1><div class="tagline">Student Portal</div></div>
      </div>
      <div class="card-body">
        <div class="step active">
          <div class="step-header"><h2>Reset Password</h2><p>Choose a new password for your account.</p></div>
          <form id="resetPasswordForm">
            <div class="input-wrap"><span class="icon">🔒</span><input id="newPassword" type="password" minlength="8" maxlength="100" placeholder="New password" required></div>
            <div class="input-wrap"><span class="icon">🔒</span><input id="confirmPassword" type="password" minlength="8" maxlength="100" placeholder="Confirm password" required></div>
            <button type="submit" class="btn-next" id="resetButton">RESET PASSWORD <span class="arrow">›</span></button>
          </form>
          <form id="resendResetForm" hidden>
            <div class="input-wrap"><span class="icon">✉</span><input id="resetEmail" type="email" placeholder="Email address" autocomplete="email"></div>
            <button type="submit" class="btn-secondary">RESEND RESET EMAIL</button>
          </form>
          <p id="resetStatus" class="help-text"></p>
        </div>
      </div>
    </div>
    <div class="card-footer"><p class="help-text"><a href="index.html">Return to sign in</a></p></div>
  </div>
  <script src="js/deployment-config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
