<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change your password - MIT Portal</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 1rem; font: 16px system-ui, sans-serif; background: #f3f6fa; color: #172033; }
    main { width: min(100%, 28rem); margin-block: auto; padding: clamp(1.25rem, 5vw, 2rem); border-radius: 1rem; background: #fff; box-shadow: 0 1rem 3rem #1720331a; }
    h1 { margin-top: 0; font-size: 1.6rem; }
    p { line-height: 1.5; }
    label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
    input { box-sizing: border-box; width: 100%; padding: .75rem; border: 1px solid #9aa6ba; border-radius: .45rem; font: inherit; }
    button { margin-top: 1.25rem; width: 100%; padding: .8rem; border: 0; border-radius: .45rem; background: #174ea6; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .65; cursor: wait; }
    [role="alert"] { color: #a12622; }
    [role="status"] { color: #176b3a; }
  </style>
</head>
<body>
  <main>
    <h1>Set a new password</h1>
    <p>Your account was created with a temporary password. Choose a new password before continuing to the student portal.</p>
    <form id="passwordChangeForm">
      <label for="currentPassword">Temporary password</label>
      <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
      <label for="newPassword">New password</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
      <p id="passwordChangeMessage" role="status" aria-live="polite"></p>
      <button id="passwordChangeSubmit" type="submit">Change password</button>
    </form>
  </main>
  <script src="js/auth.js"></script>
  <script src="js/force-password-change.js"></script>
</body>
</html>
