<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change your password - MIT Portal</title>
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="forced-auth-page">
  <button class="auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">🌙</button>
  <main>
    <h1>Set a new password</h1>
    <p>Your account was created with a temporary password. Choose a new password before continuing to the portal.</p>
    <form id="passwordChangeForm">
      <label for="currentPassword">Temporary password</label>
      <input id="currentPassword" name="currentPassword" type="password" autocomplete="current-password" required>
      <label for="newPassword">New password</label>
      <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" minlength="8" maxlength="100" required>
      <p id="passwordChangeMessage" role="status" aria-live="polite"></p>
      <button id="passwordChangeSubmit" type="submit">Change password</button>
    </form>
  </main>
  <script src="js/theme.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/force-password-change.js"></script>
</body>
</html>
