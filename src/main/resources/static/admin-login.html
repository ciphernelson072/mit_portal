<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/jpeg" href="/icons/logo.jpg">

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MIT Admin Portal – Login</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="staff-auth-page">
<button class="auth-theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark theme">🌙</button>

<div class="login-container">
  <!-- Header -->
  <div class="login-header">
    <div class="admin-icon">⚙️</div>
    <h1>Admin Portal</h1>
    <p>MIT Management System</p>
  </div>

  <!-- Alert -->
  <div class="alert" id="alert" role="alert" aria-live="assertive" hidden>
    <p id="alertText">Invalid credentials</p>
  </div>

  <!-- Form -->
  <form data-csp-action="handleAdminLogin" data-csp-event="submit" data-csp-args="%5B%7B%22%24mitCspArg%22%3A%22event%22%7D%5D">
    <!-- Username -->
    <div class="form-group">
      <label>Username *</label>
      <input type="text" id="username" placeholder="admin" required>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label>Password *</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>

    <div class="form-group" id="otpGroup" hidden>
      <label for="otp">Authenticator or recovery code *</label>
      <input type="text" id="otp" placeholder="6-digit code or recovery code"
             autocomplete="one-time-code" maxlength="12">
    </div>

    <!-- Remember Me -->
    <div class="form-group csp-inline-378e76576ae0">
      <input class="csp-inline-5d121e7bd644" type="checkbox" id="remember">
      <label class="csp-inline-9349378d037a" for="remember">Remember me</label>
    </div>

    <!-- Login Button -->
    <button type="submit" class="btn-login">Sign In</button>
  </form>

  <!-- Footer -->
  <div class="login-footer">
    <p><a href="#" data-csp-action="requestAdminPasswordReset" data-csp-event="click" data-csp-args="%5B%7B%22%24mitCspArg%22%3A%22event%22%7D%5D">Forgot password?</a> | <a href="/index.html">Student Login</a></p>
  </div>

</div>

<script src="/js/deployment-config.js"></script>
<script src="/js/auth.js"></script>
<script src="js/admin-login.js"></script>
<script src="/js/theme.js"></script>

</body>
</html>
