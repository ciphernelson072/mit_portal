<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MIT Admin Portal – Login</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #1a3a8c 0%, #d81b60 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      width: 100%;
      max-width: 400px;
      padding: 40px;
    }

    .login-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .admin-icon {
      font-size: 48px;
      margin-bottom: 12px;
    }

    .login-header h1 {
      font-size: 24px;
      color: #111;
      margin-bottom: 4px;
    }

    .login-header p {
      font-size: 13px;
      color: #666;
    }

    .alert {
      background: #fce4ec;
      border-left: 4px solid #d81b60;
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 20px;
      display: none;
    }

    .alert.show {
      display: block;
    }

    .alert p {
      font-size: 13px;
      color: #d81b60;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 12px;
      margin-bottom: 6px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1.5px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s;
    }

    input:focus {
      border-color: #d81b60;
      background: #fafafa;
    }

    .role-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }

    .role-btn {
      padding: 12px;
      border: 1.5px solid #ddd;
      background: white;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      transition: all 0.2s;
    }

    .role-btn.active {
      background: #d81b60;
      color: white;
      border-color: #d81b60;
    }

    .btn-login {
      width: 100%;
      padding: 12px;
      background: #d81b60;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-login:hover {
      background: #ad1457;
    }

    .btn-login:active {
      transform: scale(0.98);
    }

    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 12px;
      color: #999;
    }

    .login-footer a {
      color: #d81b60;
      text-decoration: none;
    }

    .info-box {
      background: #f0f0f0;
      padding: 12px;
      border-radius: 6px;
      font-size: 12px;
      color: #666;
      margin-top: 20px;
      text-align: center;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 20px;
      }

      .login-header h1 {
        font-size: 20px;
      }
    }

  </style>
</head>
<body>

<div class="login-container">
  <!-- Header -->
  <div class="login-header">
    <div class="admin-icon">⚙️</div>
    <h1>Admin Portal</h1>
    <p>MIT Management System</p>
  </div>

  <!-- Alert -->
  <div class="alert" id="alert">
    <p id="alertText">Invalid credentials</p>
  </div>

  <!-- Form -->
  <form onsubmit="handleAdminLogin(event)">
    <!-- Username -->
    <div class="form-group">
      <label>Username *</label>
      <input type="text" id="username" placeholder="admin" required>
    </div>

    <!-- Password -->
    <div class="form-group">
      <label>Password *</label>
      <input type="password" id="password" placeholder="Enter your password" required>
    </div>

    <div class="form-group" id="otpGroup" hidden>
      <label for="otp">Authenticator code *</label>
      <input type="text" id="otp" placeholder="6-digit code" inputmode="numeric"
             autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6">
    </div>

    <!-- Remember Me -->
    <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
      <input type="checkbox" id="remember" style="width: auto;">
      <label for="remember" style="margin: 0; font-weight: 400;">Remember me</label>
    </div>

    <!-- Login Button -->
    <button type="submit" class="btn-login">Sign In</button>
  </form>

  <!-- Footer -->
  <div class="login-footer">
    <p><a href="#" onclick="requestAdminPasswordReset(event)">Forgot password?</a> | <a href="index.html">Student Login</a></p>
  </div>

</div>

<script src="js/deployment-config.js"></script>
<script src="js/auth.js"></script>
<script>
  // Real authentication against POST /api/auth/login - the previous version
  // accepted a hardcoded email/password pair client-side and let the caller pick
  // their own role from four buttons with zero server verification. The role
  // buttons are gone entirely now, not just hidden: keeping decorative buttons
  // that don't affect the real login would just be different, subtler deception.
  // The role that matters comes back from the server in the login response,
  // exactly like the student login (js/script.js) and exactly like the fix
  // applied to POST /api/auth/register earlier in this project.

  function showAlert(message) {
    const alert = document.getElementById('alert');
    document.getElementById('alertText').textContent = message;
    alert.classList.add('show');
    setTimeout(() => alert.classList.remove('show'), 3000);
  }

  async function handleAdminLogin(event) {
    event.preventDefault();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    const submitBtn = document.querySelector('.btn-login');

    if (!username || !password) {
      showAlert('Please fill in all fields');
      return;
    }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Signing in…';

    try {
      const otp = document.getElementById('otp').value.trim();
      const res = await fetch(`${API}/auth/login`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password, ...(otp ? { otp } : {}) }),
      });

      if (!res.ok) {
        const errorBody = await res.clone().json().catch(() => ({}));
        if (errorBody.mfaRequired) {
          document.getElementById('otpGroup').hidden = false;
          document.getElementById('otp').focus();
          showAlert(errorBody.message || 'Enter your authenticator code.');
          if (errorBody.message === 'MFA verification required') return;
        }
        throw new Error(await getResponseErrorMessage(
          res,
          'Invalid username or password. If the portal is unavailable, refresh and try again shortly.',
        ));
      }

      if (!isJsonResponse(res)) {
        throw new Error('The portal returned an unexpected response. Refresh the page and try again.');
      }
      const data = await res.json(); // { role, username } - never the raw token

      if (data.role !== 'ADMIN' && data.role !== 'TEACHER') {
        // This is the staff portal. A student account authenticated fine but
        // doesn't belong here - the role came back from the server, so this
        // can't be bypassed by anything the client sends.
        await logout('admin-login.html');
        showAlert('This is the staff portal. Students should sign in at the student portal.');
        return;
      }

      setSession(data.role, data.username);

      if (data.role === 'ADMIN') {
        window.location.href = 'admin-dashboard.html';
      } else {
        window.location.href = 'teacher-dashboard.html';
      }
    } catch (err) {
      showAlert(err instanceof TypeError
        ? 'The portal service could not be reached. Refresh the page and try again shortly.'
        : (err.message || 'Sign-in failed. Please try again.'));
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Sign In';
    }
  }

  async function requestAdminPasswordReset(event) {
    event.preventDefault();
    const email = prompt('Enter the email address on your account:');
    if (!email) return;
    try {
      const response = await fetch(`${API}/auth/forgot-password`, {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      if (!response.ok) {
        throw new Error(await getResponseErrorMessage(response, 'Password reset request failed. Please try again shortly.'));
      }
      showAlert('If that email is registered, a reset link has been sent.');
    } catch (error) {
      showAlert(error instanceof TypeError
        ? 'The portal service could not be reached. Please try again shortly.'
        : (error.message || 'Password reset request failed.'));
    }
  }

  // Already signed in as staff? Skip straight to the dashboard. UX shortcut only
  // (see auth.js) - the real check happens server-side on every API call.
  window.addEventListener('load', function() {
    if (getRole() === 'ADMIN') {
      window.location.href = 'admin-dashboard.html';
    } else if (getRole() === 'TEACHER') {
      window.location.href = 'teacher-dashboard.html';
    }
  });
</script>

</body>
</html>
