<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>MIT Portal – Accommodation & Transport</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="css/dashboard-style.css">
</head>
<body>
  <header class="header">
    <div class="header-container">
      <div class="header-logo">
        <img src="icons/logo.jpg" alt="MIT Logo" class="logo-icon">
        <div class="brand-text">
          <h1>MIT Portal</h1>
          <span>Accommodation & Transport</span>
        </div>
      </div>
      <div class="header-actions">
        <div class="header-icons">
          <a href="dashboard.html" class="btn-primary">Back to dashboard</a>
        </div>
      </div>
    </div>
  </header>

  <main class="main-content">
    <section class="profile-summary">
      <div class="profile-container">
        <div class="profile-info-section">
          <div class="profile-greeting">
            <h2>Accommodation & Transport</h2>
            <p id="campusSummary">Loading your housing and transport details…</p>
          </div>
        </div>
      </div>
    </section>

    <section class="dashboard-grid">
      <div class="card">
        <div class="card-header">
          <h3>Transport pass</h3>
        </div>
        <div class="card-content">
          <p>Status: <span id="transportPass" class="status-badge">Checking…</span></p>
          <p id="transportDetails">Loading validity details…</p>
          <button id="renewPassBtn" type="button" class="btn-primary">Renew transport pass</button>
        </div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <div class="card-header">
          <h3>Request accommodation</h3>
        </div>
        <div class="card-content">
          <form id="hostelForm" class="support-form">
            <div class="form-row">
              <label>
                Housing request details
                <textarea name="details" rows="4" maxlength="2000" placeholder="Tell us your room preferences or accommodation need..." required></textarea>
              </label>
            </div>
            <button type="submit" class="btn-primary">Submit request</button>
          </form>
        </div>
      </div>

      <div class="card" style="grid-column: 1 / -1;">
        <div class="card-header">
          <h3>Housing applications</h3>
        </div>
        <div class="card-content">
          <div id="hostelList" class="notification-list"></div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/backend-only.js"></script>
  <script src="js/deployment-config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/hostel.js"></script>
</body>
</html>
