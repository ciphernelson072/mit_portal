spring.application.name=sis

# --- Database ---
# Laragon's default MySQL endpoint. Override these variables for another environment.
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Flyway owns schema changes in every runtime profile; Hibernate only validates mappings.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.sql.init.mode=${SQL_INIT_MODE:never}
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.baseline-version=1
sis.sample-data.enabled=${SAMPLE_DATA_ENABLED:false}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
# Caps every JOIN FETCH / collection-fetch query's result size - a safety net against
# an unbounded fetch join producing a cartesian-product-sized result set.
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true

# --- JWT ---
# JwtService validates at startup that this resolves to >= 32 bytes (HS256's minimum
# key length for Keys.hmacShaKeyFor) and fails fast with a clear message if not - see
# JwtService.init(). Supply JWT_SECRET through the environment; there is no tracked
# fallback secret.
jwt.secret=${JWT_SECRET}
# 1 hour, not 24 - short-lived access tokens are the point of a refresh-token flow
# (see AuthController's /refresh endpoint). 24h was too long-lived for a token that
# can't be revoked server-side once issued.
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
# Refresh tokens live much longer (7 days) but are only ever usable to mint a new
# access token via /api/auth/refresh, and are stored server-side so they CAN be
# revoked (e.g. on logout, password change, or account deactivation).
jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

spring.mvc.pathmatch.matching-strategy=ant_path_matcher
spring.web.resources.static-locations=classpath:/static/
spring.jackson.time-zone=Africa/Kampala
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
app.api.version=${API_VERSION:v1}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# --- File Upload ---
file.upload.directory=${UPLOAD_DIR:./uploads/}
file.upload.max-size=10485760

# --- Profile defaults ---
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
app.api.version=${API_VERSION:v1}

# --- Logging ---
# DEBUG-level app logging is fine for local dev; production should override
# LOG_LEVEL_COM_SIS to INFO or WARN (DEBUG can log request/response detail that
# shouldn't reach production log aggregation).
logging.level.com.sis=${LOG_LEVEL_COM_SIS:DEBUG}
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# --- Email ---
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SMTP_SSL_ENABLE:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS_ENABLE:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.api-key=${MAIL_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:MIT Portal}
app.backup.status-file=${BACKUP_STATUS_FILE:}
app.backup.upload-status-file=${UPLOAD_BACKUP_STATUS_FILE:}
app.backup.max-age-hours=${BACKUP_MAX_AGE_HOURS:36}
app.frontend.url=${FRONTEND_URL:http://localhost:8080}
app.security.mfa.enabled=${MFA_ENABLED:false}
app.security.mfa.issuer=${MFA_ISSUER:MIT Portal}
app.security.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}
app.finance.webhook.secret=${PAYMENT_WEBHOOK_SECRET:}
app.finance.flutterwave.secret-key=${FLUTTERWAVE_SECRET_KEY:}
app.finance.flutterwave.webhook-secret-hash=${FLUTTERWAVE_WEBHOOK_SECRET_HASH:}
app.finance.destinations.bank.account-name=${FINANCE_BANK_ACCOUNT_NAME:}
app.finance.destinations.bank.account-number=${FINANCE_BANK_ACCOUNT_NUMBER:}
app.finance.destinations.bank.branch=${FINANCE_BANK_BRANCH:}
app.finance.destinations.paypal.account=${FINANCE_PAYPAL_ACCOUNT:}
app.finance.destinations.airtel.payee=${FINANCE_AIRTEL_PAYEE:}
app.finance.destinations.airtel.merchant-code=${FINANCE_AIRTEL_MERCHANT_CODE:}
app.finance.destinations.mtn.payee=${FINANCE_MTN_PAYEE:}
app.finance.destinations.mtn.merchant-code=${FINANCE_MTN_MERCHANT_CODE:}

# --- CORS --- consumed by config.WebConfig (centralized, replaces the old
# per-controller @CrossOrigin(origins = "*") annotations)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500}
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# --- Server ---
server.port=${SERVER_PORT:8080}
# Bind beyond loopback so devices on the same trusted Wi-Fi network can reach the portal.
# Restrict access with the Windows firewall/router; do not expose this port to the public internet.
server.address=${SERVER_ADDRESS:127.0.0.1}
server.servlet.context-path=/
server.servlet.session.timeout=30m
# The auth cookie (see CookieAuthFilter) is Secure, which requires HTTPS - set this
# true in production behind TLS. Left false for local http://localhost dev, where a
# Secure cookie would silently never be sent by the browser at all.
app.security.cookie-secure=${COOKIE_SECURE:false}
app.security.cookie-same-site=${COOKIE_SAME_SITE:Strict}

# --- Multipart ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- Domain configuration ---
attendance.marking.enabled=true
attendance.threshold.percentage=75
academic.cgpa.scale=4.0
academic.grades.pass-mark=1.0
performance.monitoring.enabled=true
performance.metrics.retention.days=30
app.security.mfa.enabled=${MFA_ENABLED:false}

# --- Rate limiting (auth endpoints) ---
ratelimit.auth.capacity=10
ratelimit.auth.refill-per-minute=10
# Comma-separated direct proxy peer IPs allowed to supply X-Forwarded-For.
# Leave empty when the application is directly exposed to clients.
ratelimit.auth.trusted-proxies=${AUTH_TRUSTED_PROXY_IPS:}
# Enable only behind a platform proxy that prevents direct public access and
# supplies the client address as the final X-Forwarded-For value.
ratelimit.auth.trust-forwarded-for=${AUTH_TRUST_X_FORWARDED_FOR:false}
ratelimit.admissions.capacity=${RATELIMIT_ADMISSIONS_CAPACITY:5}
ratelimit.admissions.refill-per-minute=${RATELIMIT_ADMISSIONS_REFILL_PER_MINUTE:5}
