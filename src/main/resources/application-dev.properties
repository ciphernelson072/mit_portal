app.environment=dev
app.api.version=v1
logging.level.com.sis=DEBUG
management.endpoint.health.show-details=always

# Local-only fallback; deployments should always provide JWT_SECRET explicitly.
jwt.secret=${JWT_SECRET:mit-portal-local-dev-secret-change-me-for-production-123456}
management.health.mail.enabled=false

# Keep ordinary development loopback-only. For an intentional private-LAN test,
# override SERVER_ADDRESS with the host's Wi-Fi IPv4 address (not 0.0.0.0).
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}

# Local Laragon/MySQL dev database
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/sis_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER_CLASS_NAME:com.mysql.cj.jdbc.Driver}

# Use the same migration-managed schema policy as production. Existing non-empty
# local databases are baselined at V1, then advanced by the idempotent migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:validate}
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
app.backup.status-file=${BACKUP_STATUS_FILE:./backups/.backup-success}
