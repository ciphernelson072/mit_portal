app.environment=prod
app.api.version=v1
logging.level.com.sis=INFO
management.endpoint.health.show-details=never
management.health.mail.enabled=${MAIL_HEALTH_CHECK_ENABLED:false}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
sis.sample-data.enabled=false
jwt.secret=${JWT_SECRET}
file.upload.directory=${UPLOAD_DIR}
app.security.cookie-secure=true
app.security.cookie-same-site=${COOKIE_SAME_SITE:Strict}
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.provider=${MAIL_PROVIDER:smtp}
app.mail.api-key=${MAIL_API_KEY:}
app.mail.from-email=${MAIL_FROM_EMAIL:}
app.mail.from-name=${MAIL_FROM_NAME:MIT Portal}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
app.frontend.url=${FRONTEND_URL}
app.finance.webhook.secret=${PAYMENT_WEBHOOK_SECRET}
server.address=${SERVER_ADDRESS:0.0.0.0}
server.port=${PORT:${SERVER_PORT:8080}}
server.forward-headers-strategy=framework
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.security.mfa.enabled=${MFA_ENABLED:false}
app.security.mfa.encryption-key=${MFA_ENCRYPTION_KEY:}
attendance.marking.enabled=${ATTENDANCE_MARKING_ENABLED:true}
attendance.threshold.percentage=${ATTENDANCE_THRESHOLD_PERCENTAGE:75}
spring.jpa.open-in-view=false
management.endpoints.web.exposure.include=health,info,metrics,prometheus
sis.initial-admin-bootstrap.enabled=${INITIAL_ADMIN_BOOTSTRAP_ENABLED:false}
sis.initial-admin-bootstrap.username=${INITIAL_ADMIN_USERNAME:}
sis.initial-admin-bootstrap.email=${INITIAL_ADMIN_EMAIL:}
sis.initial-admin-bootstrap.password=${INITIAL_ADMIN_PASSWORD:}
