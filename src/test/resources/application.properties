# Test-only configuration for @SpringBootTest (SisApplicationTests).
#
# This file lives on the test classpath and Spring Boot resolves it in place of
# src/main/resources/application.properties for test runs - it isn't merged with the
# main file, so every property the app needs at startup is repeated here, with the
# database swapped for an in-memory H2 instance. This lets `mvn test` (and an IDE's
# "Run Tests") pass out of the box without a real MySQL server running, which the
# original test had no isolation from at all.

spring.application.name=sis

# In-memory H2 instead of MySQL - no external database needed to run the test suite.
spring.datasource.url=jdbc:h2:mem:sis_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# The standard H2 test context generates its schema from entity mappings. The
# MySQL integration test separately runs Flyway migrations and Hibernate validation.
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.flyway.enabled=false
sis.sample-data.enabled=true

jwt.secret=TestOnlySecretKeyNotUsedOutsideTheTestSuite
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000
ratelimit.auth.capacity=1000
ratelimit.auth.refill-per-minute=1000
ratelimit.auth.trusted-proxies=
ratelimit.admissions.capacity=1000
ratelimit.admissions.refill-per-minute=1000

file.upload.directory=${java.io.tmpdir}/sis-test-uploads/
file.upload.max-size=10485760

logging.level.com.sis=WARN

spring.mail.host=smtp.test.local
spring.mail.port=587
spring.mail.username=test@example.com
spring.mail.password=test-password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

app.mail.enabled=false
app.frontend.url=http://localhost:8080
app.security.cookie-secure=false
app.security.mfa.enabled=false
app.security.mfa.encryption-key=
app.finance.destinations.bank.account-name=MIT Test Collections
app.finance.destinations.bank.account-number=0000000000
app.finance.destinations.bank.branch=Test Branch

cors.allowed-origins=http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

server.port=0
