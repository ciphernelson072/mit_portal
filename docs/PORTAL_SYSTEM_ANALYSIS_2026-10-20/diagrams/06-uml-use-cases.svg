oe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#17324d">View assigned-course roster</text></g><g><ellipse cx="1180" cy="684" rx="170" ry="34" fill="#e8f2ff" stroke="#3f7ea5" stroke-width="2"/><text x="1180" y="690" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#17324d">Record grades / attendance</text></g><g><ellipse cx="1570" cy="684" rx="150" ry="34" fill="#e8f2ff" stroke="#3f7ea5" stroke-width="2"/><text x="1570" y="690" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#17324d">Publish materials / assignments</text></g><g><ellipse cx="745" cy="904" rx="175" ry="34" fill="#e8f2ff" stroke="#3f7ea5" stroke-width="2"/><text x="745" y="910" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#17324d">Manage users, courses, setup</text></g><g><ellipse cx="1180" cy="904" rx="170" ry="34" fill="#e8f2ff" stroke="#3f7ea5" stroke-width="2"/><text x="1180" y="910" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#17324d">Review admissions, grades, payments</text></g><g><ellipse cx="1570" cy="904" rx="150" ry="34" fill="#e8f2ff" stroke="#3f7ea5" stroke-width="2"/><text x="1570" y="910" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="600" fill="#17324d">Reports, exports, audit</text></g>
  <text x="64" y="1176" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" fill="#718397">Use cases are representative. Applicant is unauthenticated for public admissions; protected use cases require role/ownership checks.</text>
