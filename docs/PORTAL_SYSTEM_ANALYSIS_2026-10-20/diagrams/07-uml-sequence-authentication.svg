<svg xmlns="http://www.w3.org/2000/svg" width="1850" height="1190" viewBox="0 0 1850 1190">
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#eef4fa"/></linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#15324b" flood-opacity=".10"/></filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto"><path d="M1 1L11 6L1 11Z" fill="#347d91"/></marker>
  </defs>
  <rect width="1850" height="1190" fill="url(#bg)"/>
  <text x="64" y="68" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="34" font-weight="700" fill="#17324d">UML sequence · authentication and access control</text>
  <text x="64" y="104" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="17" fill="#587087">Credential validation precedes cookie issuance; each protected request is checked again</text>
  <rect x="118" y="150" width="240" height="74" rx="12" fill="#e8f2ff" stroke="#2f6f9f" stroke-width="2"/><text x="238" y="180" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d">User</text><line x1="238" y1="224" x2="238" y2="1075" stroke="#7892a5" stroke-width="2" stroke-dasharray="8 7"/><rect x="474" y="150" width="240" height="74" rx="12" fill="#e3f7f4" stroke="#197d77" stroke-width="2"/><text x="594" y="180" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d">Browser</text><line x1="594" y1="224" x2="594" y2="1075" stroke="#7892a5" stroke-width="2" stroke-dasharray="8 7"/><rect x="830" y="150" width="240" height="74" rx="12" fill="#e8f2ff" stroke="#2f6f9f" stroke-width="2"/><text x="950" y="180" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d">Security / API</text><line x1="950" y1="224" x2="950" y2="1075" stroke="#7892a5" stroke-width="2" stroke-dasharray="8 7"/><rect x="1186" y="150" width="240" height="74" rx="12" fill="#e3f7f4" stroke="#197d77" stroke-width="2"/><text x="1306" y="180" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d">Auth service</text><line x1="1306" y1="224" x2="1306" y2="1075" stroke="#7892a5" stroke-width="2" stroke-dasharray="8 7"/><rect x="1542" y="150" width="240" height="74" rx="12" fill="#e8f2ff" stroke="#2f6f9f" stroke-width="2"/><text x="1662" y="180" text-anchor="middle" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#17324d">User database</text><line x1="1662" y1="224" x2="1662" y2="1075" stroke="#7892a5" stroke-width="2" stroke-dasharray="8 7"/><line x1="238" y1="280" x2="594" y2="280" stroke="#347d91" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="416" y="270" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Enter credentials</text><line x1="594" y1="318" x2="950" y2="318" stroke="#347d91" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="772" y="308" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">POST /api/auth/login</text><line x1="950" y1="356" x2="1306" y2="356" stroke="#347d91" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1128" y="346" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Validate credentials / state</text><line x1="1306" y1="394" x2="1662" y2="394" stroke="#347d91" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1484" y="384" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Find normalized account</text><line x1="1662" y1="432" x2="1306" y2="432" stroke="#347d91" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1484" y="422" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Account · role · MFA state</text><circle cx="1656" cy="432" r="4" fill="#347d91"/><line x1="1306" y1="470" x2="950" y2="470" stroke="#347d91" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1128" y="460" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Authentication result</text><circle cx="1300" cy="470" r="4" fill="#347d91"/><line x1="950" y1="508" x2="594" y2="508" stroke="#347d91" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="772" y="498" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Set HttpOnly cookie on success</text><circle cx="944" cy="508" r="4" fill="#347d91"/><line x1="594" y1="546" x2="950" y2="546" stroke="#347d91" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="772" y="536" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Protected request + cookie</text><line x1="950" y1="584" x2="1306" y2="584" stroke="#347d91" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1128" y="574" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Validate token + authority</text><line x1="1306" y1="622" x2="1662" y2="622" stroke="#347d91" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1484" y="612" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Resolve current account</text><line x1="1662" y1="660" x2="1306" y2="660" stroke="#347d91" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1484" y="650" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Identity / active status</text><circle cx="1656" cy="660" r="4" fill="#347d91"/><line x1="1306" y1="698" x2="950" y2="698" stroke="#347d91" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="1128" y="688" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Subject + authorities</text><circle cx="1300" cy="698" r="4" fill="#347d91"/><line x1="950" y1="736" x2="594" y2="736" stroke="#347d91" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="772" y="726" text-anchor="middle" paint-order="stroke" stroke="#f7faff" stroke-width="7" stroke-linejoin="round" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#365a70">Authorized response or denial</text><circle cx="944" cy="736" r="4" fill="#347d91"/><rect x="85" y="779" width="1680" height="110" rx="12" fill="#fff" stroke="#9aaabd" stroke-width="2" stroke-dasharray="8 6"/><text x="108" y="809" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" fill="#40576b">Decision / boundary</text><text x="108" y="839" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="15" fill="#40576b">If MFA is required, the challenge is verified before an authenticated cookie is issued; invalid credentials or roles are rejected.</text>
  <text x="64" y="1166" font-family="Aptos,Segoe UI,Arial,sans-serif" font-size="13" fill="#718397">UML sequence view · representative successful and denied paths; exact API contracts may evolve.</text>
</svg>